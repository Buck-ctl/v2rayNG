name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Init and update submodules explicitly
      run: |
        git submodule update --init --recursive

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

    - name: Install NDK and Set Version
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=0 --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV
        sed -i 's/namespace = "com.v2ray.ang"/ndkVersion = "30.0.16248370"\n    namespace = "com.v2ray.ang"/' V2rayNG/app/build.gradle.kts
        sed -i 's/versionName = ".*"/versionName = "543370K"/' V2rayNG/app/build.gradle.kts

    - name: Build APK
      run: |
        cd V2rayNG
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK folder
      uses: actions/upload-artifact@v4
      with:
        name: v2rayng-debug-apks
        path: V2rayNG/app/build/outputs/apk/debug/
        
